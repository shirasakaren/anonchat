services:
  app:
    build: .
    image: anonchat:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anonchat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anonchat}
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STORE_IP_ADDRESSES: ${STORE_IP_ADDRESSES:-false}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-100000}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-25}
      MAX_ATTACHMENTS_PER_MESSAGE: ${MAX_ATTACHMENTS_PER_MESSAGE:-5}
      MESSAGE_EDIT_WINDOW_MINUTES: ${MESSAGE_EDIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MESSAGES_PER_MINUTE: ${RATE_LIMIT_MESSAGES_PER_MINUTE:-20}
      RATE_LIMIT_REGISTRATIONS_PER_HOUR: ${RATE_LIMIT_REGISTRATIONS_PER_HOUR:-10}
      RATE_LIMIT_LINK_PREVIEWS_PER_MINUTE: ${RATE_LIMIT_LINK_PREVIEWS_PER_MINUTE:-20}
      LINK_PREVIEWS_ENABLED: ${LINK_PREVIEWS_ENABLED:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anonchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-anonchat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anonchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: self-hosted S3-compatible object storage. Enable with:
  #   docker compose --profile minio up -d
  # and set STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000, S3_BUCKET=anonchat,
  # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY matching the values below.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anonchat}
      # No insecure fallback default here on purpose (unlike POSTGRES_PASSWORD,
      # which also has none) - MinIO's admin console is reachable on :9001,
      # so a well-known default would be a real credential exposure.
      # scripts/setup.sh generates a strong value for you; set it yourself in
      # .env if you're enabling this profile manually.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  uploads:
  minio-data:
